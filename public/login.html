<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wink Gaming Launcher - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: #11141c;
            --card-bg: #181c28;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #262c40;
            --badge-green: #10b981;
            --badge-red: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; background-image: linear-gradient(180deg, rgba(10, 12, 16, 0.8) 0%, #0a0c10 100%), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200'); background-size: cover; background-position: center; }

        .login-card { background: rgba(17, 20, 28, 0.9); backdrop-filter: blur(15px); border: 1px solid var(--border-color); border-radius: 20px; padding: 35px; width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); text-align: center; }
        .logo-box { width: 60px; height: 60px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; margin: 0 auto 15px; box-shadow: 0 0 20px rgba(37, 99, 235, 0.5); }
        .login-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .login-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

        .tabs { display: flex; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 4px; margin-bottom: 25px; }
        .tab { flex: 1; padding: 10px; font-size: 13px; font-weight: 700; background: transparent; border: none; color: var(--text-muted); cursor: pointer; border-radius: 9px; transition: 0.3s; }
        .tab.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan)); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }

        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); }
        .form-group input { width: 100%; background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; color: var(--text-main); outline: none; transition: 0.3s; font-size: 14px; }
        .form-group input:focus { border-color: var(--accent-blue); box-shadow: 0 0 12px rgba(37, 99, 235, 0.3); }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; padding: 13px; border: none; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6); }
        .error-msg { color: var(--badge-red); font-size: 13px; margin-top: 12px; font-weight: 700; background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(239, 68, 68, 0.3); display: none; text-align: right; white-space: pre-line; line-height: 1.6; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">W</div>
        <h2>نظام إدارة سيرفر Wink</h2>
        <p>Wink Administration & Gaming Launcher</p>

        <!-- أزرار التبديل بين المسؤولين والمتقدمين -->
        <div class="tabs">
            <button class="tab active" id="adminTabBtn" onclick="switchTab('admin')">المسؤولين</button>
            <button class="tab" id="applicantTabBtn" onclick="switchTab('applicant')">المتقدمين للاختبار</button>
        </div>

        <!-- نموذج تسجيل دخول المسؤولين -->
        <form id="adminForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم (Username)</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label>كلمة المرور (Password)</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور..." required>
            </div>

            <div class="form-group">
                <label>أيدي اللعبة (Game ID / FiveM ID)</label>
                <input type="text" id="adminGameId" placeholder="أدخل الأيدي الخاص بك داخل السيرفر..." required>
            </div>

            <button type="submit" class="btn-submit">تسجيل دخول المسؤول 🚀</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>

        <!-- نموذج انتقال المتقدمين لصفحة الاختبار -->
        <form id="applicantForm" class="hidden" onsubmit="handleApplicantLogin(event)">
            <div class="form-group">
                <label>اسم أو منشن الدسكورد (Discord)</label>
                <input type="text" id="appDiscord" placeholder="مثال: player#1234" required>
            </div>

            <div class="form-group">
                <label>آي دي الدسكورد الرقمي (Discord ID - Copy ID)</label>
                <input type="text" id="appDiscordId" placeholder="مثال: 982345678912345678" required>
                <small style="color: var(--accent-cyan); font-size: 11px;">اضغط كليك يمين على حسابك في ديسكورد واختار Copy ID</small>
            </div>

            <div class="form-group">
                <label>العمر (Age)</label>
                <input type="number" id="appAge" placeholder="أدخل عمرك الحقيقي..." required min="12" max="60">
            </div>

            <div class="form-group">
                <label>أيدي اللعبة (Game ID / FiveM ID)</label>
                <input type="text" id="appGameId" placeholder="أدخل الأيدي الخاص بك..." required>
            </div>

            <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #10b981, #059669);">دخول لصفحة الاختبار 🎮</button>
        </form>
    </div>

    <script>
        function switchTab(type) {
            const adminTab = document.getElementById('adminTabBtn');
            const applicantTab = document.getElementById('applicantTabBtn');
            const adminForm = document.getElementById('adminForm');
            const applicantForm = document.getElementById('applicantForm');

            if (type === 'admin') {
                adminTab.classList.add('active');
                applicantTab.classList.remove('active');
                adminForm.classList.remove('hidden');
                applicantForm.classList.add('hidden');
            } else {
                applicantTab.classList.add('active');
                adminTab.classList.remove('active');
                applicantForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            }
        }

        function getDeviceId() {
            let deviceId = localStorage.getItem('wink_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('wink_device_id', deviceId);
            }
            return deviceId;
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const gameId = document.getElementById('adminGameId').value;
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.style.display = 'none';
            errorDiv.innerText = '';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username, 
                        password, 
                        gameId,
                        deviceId: getDeviceId() 
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('wink_role', data.role);
                    localStorage.setItem('wink_name', data.name);
                    localStorage.setItem('wink_username', data.username);
                    localStorage.setItem('wink_gameId', data.gameId);
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.style.color = data.pendingDevice ? '#f59e0b' : 'var(--badge-red)';
                    errorDiv.innerText = data.message || 'بيانات الدخول غير صحيحة أو تم رفض الجهاز!';
                }
            } catch (err) {
                errorDiv.style.display = 'block';
                errorDiv.style.color = 'var(--badge-red)';
                errorDiv.innerText = 'حدث خطأ في الاتصال بالخادم.';
            }
        }

        function handleApplicantLogin(e) {
            e.preventDefault();
            const discord = document.getElementById('appDiscord').value;
            const discordId = document.getElementById('appDiscordId').value;
            const age = document.getElementById('appAge').value;
            const gameId = document.getElementById('appGameId').value;

            localStorage.setItem('wink_discord', `${discord} (ID: ${discordId})`);
            localStorage.setItem('wink_discord_id', discordId);
            localStorage.setItem('wink_age', age);
            localStorage.setItem('wink_gameId', gameId);

            window.location.href = 'exam.html';
        }
    </script>
</body>
</html>
