<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wink Server - اختبار القبول (Roleplay Exam)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: #11141c;
            --card-bg: #181c28;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #262c40;
            --badge-green: #10b981;
            --badge-red: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background-image: linear-gradient(180deg, rgba(10, 12, 16, 0.8) 0%, #0a0c10 100%), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200'); background-size: cover; background-position: center; }

        .exam-container { background: rgba(17, 20, 28, 0.95); backdrop-filter: blur(15px); border: 1px solid var(--border-color); border-radius: 20px; width: 100%; max-width: 650px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); max-height: 90vh; overflow-y: auto; }
        .exam-header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .exam-header h1 { font-size: 22px; font-weight: 900; color: var(--accent-cyan); margin-bottom: 5px; }
        .exam-header p { color: var(--text-muted); font-size: 13px; }

        .info-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
        .info-group { flex: 1; min-width: 140px; text-align: right; }
        .info-group label { display: block; font-size: 11px; color: var(--text-muted); font-weight: bold; margin-bottom: 4px; }
        .info-group input { width: 100%; background: var(--panel-bg); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .hint-text { font-size: 10px; color: var(--accent-cyan); margin-top: 3px; display: block; }

        .question-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
        .question-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; color: #fff; }
        
        .options-list { display: flex; flex-direction: column; gap: 8px; }
        .option-label { display: flex; align-items: center; gap: 10px; background: var(--panel-bg); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .option-label:hover { border-color: var(--accent-blue); background: rgba(37, 99, 235, 0.05); }
        .option-label input { accent-color: var(--accent-blue); }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: #fff; padding: 14px; border: none; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6); }

        .result-box { text-align: center; display: none; padding: 20px; }
        .result-box h2 { font-size: 24px; font-weight: 900; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="exam-container">
        <div class="exam-header">
            <h1>اختبار القبول الرسمي - سيرفر WINK</h1>
            <p>أجب عن الأسئلة التالية بدقة عالية لاجتياز اختبار القبول</p>
        </div>

        <form id="examForm" onsubmit="submitExam(event)">
            <div class="info-box">
                <div class="info-group">
                    <label>المنشن أو اسم الدسكورد</label>
                    <input type="text" id="discordInput" placeholder="مثال: player#1234" required>
                </div>
                <div class="info-group">
                    <label>آي دي الديسكورد الرقمي (Copy ID)</label>
                    <input type="text" id="discordIdNum" placeholder="مثال: 9823456789" required>
                    <span class="hint-text">كليك يمين على حسابك في ديسكورد واختار Copy ID</span>
                </div>
                <div class="info-group" style="max-width: 90px;">
                    <label>العمر</label>
                    <input type="number" id="ageInput" placeholder="العمر" required min="12" max="60">
                </div>
                <div class="info-group">
                    <label>أيدي اللعبة (Game ID)</label>
                    <input type="text" id="gameIdInput" placeholder="أيدي السيرفر" required>
                </div>
            </div>

            <div id="questionsContainer"></div>

            <button type="submit" class="btn-submit">إرسال الإجابات النهائية 🚀</button>
        </form>

        <div id="resultBox" class="result-box">
            <h2 id="resultTitle"></h2>
            <p id="resultDesc" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;"></p>
            <button class="btn-submit" onclick="window.location.href='login.html'">العودة لصفحة الدخول 🏠</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "1. ما هو تعريف الـ RDM (Random Deathmatch) في سيرفرات الرول بلاي؟",
                options: [
                    "قتل أو ضرب اللاعبين بدون سبب أو سيناريو مسبق ومبرر رول بلاي.",
                    "الدفاع عن النفس ضد هجوم مسلح.",
                    "ملاحقة شخص سرق سيارتك."
                ],
                correct: 0
            },
            {
                q: "2. ماذا تعني كلمة Powergaming (باور جيمنج)؟",
                options: [
                    "امتلاك أقوى سيارة في السيرفر.",
                    "إجبار الشخصيات الأخرى على أفعال لا تستطيع الدفاع عنها أو فعل أشياء مستحيلة واقعياً.",
                    "سرقة البنوك لوحدك بدون شروط."
                ],
                correct: 1
            },
            {
                q: "3. تعرضت لحادث سير قوي جداً ومميت، ما هو التصرف الصحيح واقعياً (FearRP)؟",
                options: [
                    "النهوض فوراً والهرب بالسيارة كأن شيئاً لم يكن.",
                    "تمثيل الإصابة والخوف على حياتك وعدم الحركة وإبلاغ الإسعاف.",
                    "شتم الشخص الذي صدمك في البث الصوتي."
                ],
                correct: 1
            },
            {
                q: "4. ما هو تعريف الـ VDM (Vehicle Deathmatch)؟",
                options: [
                    "قيادة السيارة بسرعة فائقة في الشوارع العامة.",
                    "صدم اللاعبين أو قتلهم باستخدام السيارة كأنها سلاح.",
                    "تفجير محطة الوقود بالسيارة."
                ],
                correct: 1
            },
            {
                q: "5. ماذا تعني منطقة الآمنة (Greenzone)؟",
                options: [
                    "مكان ممنوع فيه ارتكاب أي أعمال إجرامية أو قتل أو سرقة نهائياً.",
                    "مكان مخصص لتجمع العصابات فقط.",
                    "منطقة مخصصة لشراء السيارات الفخمة."
                ],
                correct: 0
            },
            {
                q: "6. إذا رأيت شخصاً يخالف قواعد السيرفر بشكل واضح أثناء السيناريو، ماذا تفعل؟",
                options: [
                    "أقوم بشتمه ومخالفة القوانين مثله.",
                    "أكمل السيناريو للنهاية وأقوم بفتح تذكرة (Ticket) مع توفير الدليل للإدارة.",
                    "أقوم بطرده من اللعبة فوراً."
                ],
                correct: 1
            },
            {
                q: "7. ما هو النطق الصحيح عند التعامل مع معلومات OOC (خارج الشخصية) داخل اللعبة؟",
                options: [
                    "استخدامها ضد اللاعبين في الشات العام.",
                    "يجب منع الخلط بين معلومات الحياة الحقيقية وداخل اللعبة (No Meta-gaming).",
                    "نشرها في ديسكورد السيرفر."
                ],
                correct: 1
            },
            {
                q: "8. ما هو الـ Meta-gaming (ميتا جيمنج)؟",
                options: [
                    "استخدام معلومات حصلت عليها من خارج اللعبة (مثل البث المباشر أو الديسكورد) داخل اللعبة.",
                    "شراء معدات عسكرية بطريقة قانونية.",
                    "العمل في الوظائف الحكومية."
                ],
                correct: 0
            },
            {
                q: "9. قام شخص برفع السلاح بوجهك وطلب منك تسليم أموالك (FearRP)، ما هو ردة الفعل الصحيحة؟",
                options: [
                    "أقوم بإخراج سلاحي وقتله بسرعة.",
                    "أقوم بالهرب فوراً لكي لا يسرقني.",
                    "أستسلم لمطالبه خوفاً على حياتي وحفاظاً على قواعد الخوف الواقعي."
                ],
                correct: 2
            },
            {
                q: "10. ما هي الطريقة الصحيحة للتحدث عبر الميكروفون داخل السيرفر؟",
                options: [
                    "التحدث بصوت واضح وعدم الصراخ وتشغيل الأغاني المزعجة أو الشتم.",
                    "الصراخ على اللاعبين الجدد لفرض السيطرة.",
                    "التحدث بلغة غير مفهومة."
                ],
                correct: 0
            }
        ];

        document.getElementById('discordInput').value = localStorage.getItem('wink_discord') || '';
        document.getElementById('discordIdNum').value = localStorage.getItem('wink_discord_id') || '';
        document.getElementById('ageInput').value = localStorage.getItem('wink_age') || '';
        document.getElementById('gameIdInput').value = localStorage.getItem('wink_gameId') || '';

        const container = document.getElementById('questionsContainer');
        questions.forEach((item, index) => {
            let div = document.createElement('div');
            div.className = 'question-card';
            div.innerHTML = `
                <div class="question-title">${item.q}</div>
                <div class="options-list">
                    ${item.options.map((opt, optIdx) => `
                        <label class="option-label">
                            <input type="radio" name="q_${index}" value="${optIdx}" required>
                            <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
            `;
            container.appendChild(div);
        });

        async function submitExam(e) {
            e.preventDefault();
            let score = 0;
            questions.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q_${index}"]:checked`);
                if (selected && parseInt(selected.value) === item.correct) {
                    score += 10;
                }
            });

            const discord = document.getElementById('discordInput').value;
            const discordId = document.getElementById('discordIdNum').value;
            const age = document.getElementById('ageInput').value;
            const gameId = document.getElementById('gameIdInput').value;

            try {
                const res = await fetch('/api/submit-exam', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        discord: `${discord} (ID: ${discordId})`, 
                        discordId,
                        age, 
                        gameId, 
                        score, 
                        total: 100 
                    })
                });

                if (res.ok) {
                    document.getElementById('examForm').style.display = 'none';
                    const resultBox = document.getElementById('resultBox');
                    resultBox.style.display = 'block';

                    if (score >= 70) {
                        document.getElementById('resultTitle').style.color = 'var(--badge-green)';
                        document.getElementById('resultTitle').innerText = `🎉 مبروك! لقد اجتازت الاختبار بنجاح`;
                        document.getElementById('resultDesc').innerText = `درجتك هي: ${score} / 100. تم إرسال طلبك للإدارة للمراجعة والقبول النهائي.`;
                    } else {
                        document.getElementById('resultTitle').style.color = 'var(--badge-red)';
                        document.getElementById('resultTitle').innerText = `❌ عذراً، لم تجتز الاختبار`;
                        document.getElementById('resultDesc').innerText = `درجتك هي: ${score} / 100. الحد الأدنى للنجاح هو 70 درجة.`;
                    }
                } else {
                    alert('عذراً، التقديم مغلق حالياً من قبل الإدارة.');
                }
            } catch (err) {
                alert('حدث خطأ أثناء إرسال الاختبار.');
            }
        }
    </script>
</body>
</html>
